name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  keyless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:viewer
      - run: git diff --exit-code -- src/public/model-viewer.js
      - run: python3 -m unittest discover -s test -p "*_test.py"
      - run: npm run build:gallery
      - run: git diff --exit-code -- site/index.html
      - run: npm test
      - run: npm run check
